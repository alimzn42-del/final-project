# Local MixLine stack. Copy .env.example to .env first.
# Services: db + mqtt (infrastructure), migrate (one-shot), backend, simulator,
# frontend (the web app behind nginx; browsers use only this one).
name: mixline

services:
  db:
    # PostgreSQL 16 with the TimescaleDB extension (multi-arch: amd64 + arm64).
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    # TimescaleDB reports anonymous usage data to Timescale by default; the line
    # runs offline and sends nothing out, so it is switched off.
    command: ['postgres', '-c', 'timescaledb.telemetry_level=off']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to this machine only, for local tools; other services use the
      # internal network name "db".
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  mqtt:
    # Eclipse Mosquitto MQTT broker (multi-arch: amd64 + arm64).
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    # Our script writes the password file from .env, then hands over to the
    # image's own entrypoint.
    entrypoint: ['sh', '/etc/mixline/entrypoint.sh']
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
    ports:
      - '127.0.0.1:${MQTT_PORT:-1883}:1883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/etc/mixline/mosquitto.conf:ro
      - ./docker/mosquitto/entrypoint.sh:/etc/mixline/entrypoint.sh:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      # Healthy = an authenticated client can read the broker's own status topic.
      test:
        - CMD-SHELL
        - mosquitto_sub -h localhost -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" -t '$$SYS/broker/uptime' -C 1 -W 3 > /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    # One-shot: applies the database migrations (Prisma), then exits.
    # The backend starts only after it finished successfully.
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      target: migrate
      args:
        APP: backend
    image: mixline/migrate:local
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

  backend:
    # NestJS API: machine config and locales now; auth, telemetry and state in later steps.
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      args:
        APP: backend
    image: mixline/backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    environment:
      PORT: 3000
      MACHINE_CONFIG: /config/machine.json
      LOCALES_DIR: /config/locales
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MANAGER_EMAIL: ${MANAGER_EMAIL:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      CLOCK_TOLERANCE_MS: ${CLOCK_TOLERANCE_MS:-2000}
      # nginx (frontend) is in front: the client's address comes from its X-Forwarded-For.
      TRUST_PROXY: 1
    ports:
      # This computer only (checks, tools). Browsers go through nginx: if this port were
      # open to the network, a client could send a fake X-Forwarded-For.
      - '127.0.0.1:${PORT:-3000}:3000'
    volumes:
      # Read-only: the backend reads the line description, never changes it.
      - ./config:/config:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  simulator:
    # Publishes fake telemetry on the real topics until the hardware exists.
    build:
      context: .
      dockerfile: docker/node-app.Dockerfile
      args:
        APP: simulator
    image: mixline/simulator:local
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MACHINE_CONFIG: /config/machine.json
    volumes:
      # Read-only: the simulator reads the line description, never changes it.
      - ./config:/config:ro

  frontend:
    # The web app (Vite build) served by nginx, which passes /api and the live
    # WebSocket to the backend. The only service browsers on the lab network use.
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: mixline/frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ > /dev/null']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  db-data:
  mqtt-data:
