packages:
  - apps/*
  - packages/*

# pnpm 10 runs no install scripts unless listed here. Allowed:
# - prisma, @prisma/engines: download the migration engine at install time, so a
#   Docker image never needs the internet when it starts (the lab is offline);
# - esbuild: checks its native binary (used by tsx and Vitest).
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
