# MixLine MQTT broker.
# Anonymous clients are refused; accounts come from .env via entrypoint.sh.

listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd

# Keep retained messages (for example lab/mixline/state) across restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
