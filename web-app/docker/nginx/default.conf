# The web app and the API on one address (docs/04-architecture.md "frontend").
# Included inside nginx's http block.

# WebSocket: pass the browser's upgrade request on (the live push, /api/socket.io).
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's own name server, asked again every 10 s: when the backend container
  # is recreated (new address), nginx follows instead of answering 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwritten, not appended: a browser cannot fake its address to get around
    # the login limits. The backend trusts exactly this one hop (TRUST_PROXY=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # A live connection stays open for hours; socket.io pings every 25 s.
    proxy_read_timeout 1h;
  }

  # Built files carry a hash in their name: they never change, cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Every other address is a page of the app (React Router): always the latest index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
